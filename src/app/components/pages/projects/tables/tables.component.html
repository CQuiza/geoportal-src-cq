
<P></P>

<form [formGroup]="partyForm" (ngSubmit)="onPartySubmit()" class="form">
    <mat-form-field appearance="fill">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Cristhian Quiza" type="name">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Number id</mat-label>
      <input matInput formControlName="number_id" placeholder="123123123" type="number_id">
    </mat-form-field>

    <mat-form-field appearance="fill">
        <mat-label>Address</mat-label>
        <input matInput formControlName="address" placeholder="neiva" type="address">
    </mat-form-field>
    

    <mat-form-field appearance="fill">
      <mat-label>Phone Number</mat-label>
      <input matInput formControlName="phone" placeholder="637775246782" type="phone">
    </mat-form-field>

    @if (selectedState === 'save') {
        <button mat-raised-button color="accent" type="submit">Save</button>
      }@else {
        <button mat-raised-button color="primary" (click)="updateParty()">Update</button>
        <button mat-raised-button color="button" (click)="resetFormParty()">reset Form</button>
      }
  </form>

  <section>
    <div>

      <table mat-table [dataSource]="data" class="mat-elevation-z8">

        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Position Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> Id </th>
          <button mat-raised-button *matCellDef="let element" (click)=" getRecordParty(element.id)"> {{element.id}} </button>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="number_id">
          <th mat-header-cell *matHeaderCellDef> Number id </th>
          <td mat-cell *matCellDef="let element"> {{element.number_id}} </td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef> Address </th>
          <td mat-cell *matCellDef="let element"> {{element.address}} </td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef> Phone </th>
          <td mat-cell *matCellDef="let element"> {{element.phone}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

    </div>
  </section>

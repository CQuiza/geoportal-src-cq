<mat-card style="width: auto; height: auto;">

@if (landAptitude) {
  <app-land-aptitude [aptitudes] = "landAptitude" [cultivosAptos] = "cultivosAptos"></app-land-aptitude>
}



@if (authService.isLoggedIn$ |async) {
  <mat-card style="width: auto; height: auto;">
    <mat-card-header>
      <!--mat-card-title>Entidades</mat-card-title>

    </mat-card-header>
